name: Architect DAX reviewer and setup tests

on:
  pull_request:
    paths:
      - ".agents/skills/dax-measure-standards-review/**"
      - "tests/test_dax_measure_reviewer.py"
      - "tests/test_setup_instructions.py"
      - "tests/test_project_installer.py"
      - "tests/test_project_update.py"
      - "scripts/update_project.py"
      - "scripts/install_into_project.py"
      - ".agents/skills/setup-power-bi-architect/**"
      - "SETUP.md"
      - "README.md"
      - ".github/workflows/dax-measure-reviewer-tests.yml"
  push:
    branches: [main]
    paths:
      - ".agents/skills/dax-measure-standards-review/**"
      - "tests/test_dax_measure_reviewer.py"
      - "tests/test_setup_instructions.py"
      - "tests/test_project_installer.py"
      - "tests/test_project_update.py"
      - "scripts/update_project.py"
      - "scripts/install_into_project.py"
      - ".agents/skills/setup-power-bi-architect/**"
      - "SETUP.md"
      - "README.md"
      - ".github/workflows/dax-measure-reviewer-tests.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests (synthetic; no private model data)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Syntax compile
        run: python -m py_compile .agents/skills/dax-measure-standards-review/scripts/review_measures.py scripts/install_into_project.py scripts/update_project.py

      - name: Fetch public canonical standards at reviewed pinned SHA
        uses: actions/checkout@v4
        with:
          repository: GitKlink/power-bi-fabric-standards
          ref: 2d6eb0c2dd627b7607c0ad28a4ea6866e5427aa9
          path: standards-pinned
          persist-credentials: false
      - name: Synthetic end-to-end read-only review (pinned source)
        run: |
          python .agents/skills/dax-measure-standards-review/scripts/review_measures.py \
            --input examples/dax-measure-review/measure-inventory.synthetic.csv \
            --standards-root standards-pinned \
            --domain variable_reward \
            --out-dir /tmp/power-bi-architect-review-smoke
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/power-bi-architect-review-smoke/review.json").read_text(encoding="utf-8"))
          assert report["schema_version"] == "power-bi-fabric-architect-dax-measure-review-v1"
          assert report["status"] == "partial_review_only"
          assert report["standards"]["git_sha"] == "2d6eb0c2dd627b7607c0ad28a4ea6866e5427aa9"
          assert report["measures"] == 4
          assert any(f["name"] == "M_VR Payout%" and f["rule_id"] == "SM-NAME-PREFIX" for f in report["findings"])
          assert Path("/tmp/power-bi-architect-review-smoke/review.md").is_file()
          print("Synthetic pinned-standards smoke test passed. No real model data was used.")
          PY

      - name: Project-local install, idempotence and independent review smoke test
        shell: bash
        run: |
          set -eu
          project="/tmp/power-bi-architect-test-project"
          mkdir -p "$project/.agents/skills/existing-skill"
          echo "existing" > "$project/.agents/skills/existing-skill/SKILL.md"
          python scripts/install_into_project.py --project "$project" --standards-repo standards-pinned
          test ! -e "$project/docs/power-bi-architect/installation.json"
          python scripts/install_into_project.py --project "$project" --standards-repo standards-pinned --apply
          test "$(cat "$project/.agents/skills/existing-skill/SKILL.md")" = "existing"
          test -f "$project/.agents/skills/power-bi-architect/dax-measure-standards-review/SKILL.md"
          test ! -e "$project/.agents/skills/dax-measure-standards-review"
          (
            cd "$project"
            python .agents/skills/power-bi-architect/dax-measure-standards-review/scripts/review_measures.py \
              --input .agents/skills/power-bi-architect/dax-measure-standards-review/examples/measure-inventory.synthetic.csv \
              --standards-root docs/power-bi-architect/standards \
              --domain variable_reward \
              --out-dir /tmp/power-bi-architect-installed-smoke
          )
          python - <<'PY'
          import json
          from pathlib import Path
          project = Path("/tmp/power-bi-architect-test-project")
          result = json.loads(Path("/tmp/power-bi-architect-installed-smoke/review.json").read_text())
          install = json.loads((project/"docs/power-bi-architect/installation.json").read_text())
          assert result["standards"]["verification"] == "pinned_project_copy"
          assert result["standards"]["git_sha"] == "2d6eb0c2dd627b7607c0ad28a4ea6866e5427aa9"
          assert result["schema_version"] == "power-bi-fabric-architect-dax-measure-review-v1"
          assert result["measures"] == 4 and len(result["findings"]) == 6
          assert install["capabilities"] == ["dax-measure-standards-review"]
          assert install["skills_provider"] == "power-bi-architect"
          assert len(install["installed_assets_sha256"]) >= 18
          print("Project-local install and independent reviewer smoke test passed.")
          PY
          python scripts/install_into_project.py --project "$project" --standards-repo standards-pinned --apply | grep 'ALREADY INSTALLED'
          echo "tamper" >> "$project/docs/power-bi-architect/standards/semantic-model/business_glossary.md"
          if (
              cd "$project"
              python .agents/skills/power-bi-architect/dax-measure-standards-review/scripts/review_measures.py \
                --input .agents/skills/power-bi-architect/dax-measure-standards-review/examples/measure-inventory.synthetic.csv \
                --standards-root docs/power-bi-architect/standards \
                --domain variable_reward \
                --out-dir /tmp/power-bi-architect-tamper-smoke
          ); then
            echo "ERROR: tampered standard was accepted"
            exit 1
          fi
          test ! -e /tmp/power-bi-architect-tamper-smoke/review.json
          echo "Tamper rejection passed."
          cursor_project="/tmp/power-bi-architect-cursor-skills-project"
          mkdir -p "$cursor_project/.cursor/skills/existing-skill"
          echo "keep" > "$cursor_project/.cursor/skills/existing-skill/SKILL.md"
          python scripts/install_into_project.py --project "$cursor_project" --standards-repo standards-pinned --apply
          test -f "$cursor_project/.cursor/skills/power-bi-architect/dax-measure-standards-review/SKILL.md"
          test ! -e "$cursor_project/.cursor/skills/dax-measure-standards-review"
          test ! -e "$cursor_project/.agents/skills/power-bi-architect/dax-measure-standards-review/SKILL.md"
          test "$(cat "$cursor_project/.cursor/skills/existing-skill/SKILL.md")" = "keep"
          (
            cd "$cursor_project"
            python .cursor/skills/power-bi-architect/dax-measure-standards-review/scripts/review_measures.py \
              --input .cursor/skills/power-bi-architect/dax-measure-standards-review/examples/measure-inventory.synthetic.csv \
              --standards-root docs/power-bi-architect/standards \
              --domain variable_reward \
              --out-dir /tmp/power-bi-architect-cursor-skills-smoke
          )
          python - <<'PY'
          import json
          from pathlib import Path
          project = Path("/tmp/power-bi-architect-cursor-skills-project")
          install = json.loads((project/"docs/power-bi-architect/installation.json").read_text())
          result = json.loads(Path("/tmp/power-bi-architect-cursor-skills-smoke/review.json").read_text())
          assert install["skills_dir"] == ".cursor/skills"
          assert install["skills_provider"] == "power-bi-architect"
          assert result["standards"]["verification"] == "pinned_project_copy"
          print("Existing .cursor/skills layout preserved and reviewer smoke test passed.")
          PY

      - name: Update existing copied project from a newly committed local Architect clone
        shell: bash
        run: |
          set -eu
          source_dir="/tmp/power-bi-architect-update-source"
          project="/tmp/power-bi-architect-update-project"
          git clone -q "$GITHUB_WORKSPACE" "$source_dir"
          git -C "$source_dir" remote set-url origin "https://github.com/GitKlink/performance-reward-dashboard-architect.git"
          git -C "$source_dir" config user.name "Synthetic CI"
          git -C "$source_dir" config user.email "synthetic@example.invalid"
          mkdir -p "$project/.cursor/skills/matt-pocock"
          echo "keep this project skill" > "$project/.cursor/skills/matt-pocock/README.txt"
          python "$source_dir/scripts/install_into_project.py" \
            --project "$project" --standards-repo "$GITHUB_WORKSPACE/standards-pinned" --apply

          # Simulate a reviewed, committed local source change. Nothing is pushed.
          echo "" >> "$source_dir/.agents/skills/dax-measure-standards-review/README.md"
          echo "<!-- Synthetic CI source update, never pushed -->" >> "$source_dir/.agents/skills/dax-measure-standards-review/README.md"
          git -C "$source_dir" add .agents/skills/dax-measure-standards-review/README.md
          git -C "$source_dir" commit -qm "test: synthetic local clone source revision"

          python "$source_dir/scripts/update_project.py" \
            --project "$project" --standards-repo "$GITHUB_WORKSPACE/standards-pinned" \
            > /tmp/power-bi-architect-approved-plan.txt
          plan_id=$(python - <<'PY'
          import json
          from pathlib import Path
          text=Path("/tmp/power-bi-architect-approved-plan.txt").read_text()
          plan=json.loads(text.split("\nPLAN ONLY")[0])
          assert plan["count"]["replace"] >= 1
          assert plan["old_architect_sha"] != plan["new_architect_sha"]
          assert plan["skills_dir"] == ".cursor/skills"
          print(plan["plan_id"])
          PY
          )
          if python "$source_dir/scripts/update_project.py" \
            --project "$project" --standards-repo "$GITHUB_WORKSPACE/standards-pinned" \
            --apply --expected-plan-id "bad-plan"; then
              echo "ERROR: updater accepted an unapproved plan"
              exit 1
          fi
          python "$source_dir/scripts/update_project.py" \
            --project "$project" --standards-repo "$GITHUB_WORKSPACE/standards-pinned" \
            --apply --expected-plan-id "$plan_id"
          grep -q 'Synthetic CI source update' \
            "$project/.cursor/skills/power-bi-architect/dax-measure-standards-review/README.md"
          test "$(cat "$project/.cursor/skills/matt-pocock/README.txt")" = "keep this project skill"
          python - <<'PY'
          import json
          from pathlib import Path
          proj=Path("/tmp/power-bi-architect-update-project")
          m=json.loads((proj/"docs/power-bi-architect/installation.json").read_text())
          assert m["skills_dir"] == ".cursor/skills"
          assert m["skills_provider"] == "power-bi-architect"
          assert m["architect_git_sha"] != "116384977471431f99fa129669c7329269cb69fd"
          assert "dax-measure-standards-review" in m["capabilities"]
          PY
          (
            cd "$project"
            python .cursor/skills/power-bi-architect/dax-measure-standards-review/scripts/review_measures.py \
              --input .cursor/skills/power-bi-architect/dax-measure-standards-review/examples/measure-inventory.synthetic.csv \
              --standards-root docs/power-bi-architect/standards \
              --domain variable_reward \
              --out-dir /tmp/power-bi-architect-updated-smoke
          )
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("/tmp/power-bi-architect-updated-smoke/review.json").read_text())
          assert r["standards"]["verification"] == "pinned_project_copy"
          assert r["measures"] == 4 and len(r["findings"]) == 6
          print("Approved update + independent installed review passed.")
          PY
